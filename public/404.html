<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      //
      // GitHub Pages has no server-side rewrites, so a deep link (e.g.
      // /work/14286) 404s here on refresh or direct visit. This redirects
      // back to index.html with the real path packed into a query string,
      // which index.html then unpacks via history.replaceState before the
      // app mounts — so react-router sees the correct route.

      // Number of path segments that make up the site's root — 1 for a
      // GitHub Pages *project* site (https://<user>.github.io/<repo>/...).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
